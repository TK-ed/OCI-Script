name: OCI VM Provisioner
on:
  schedule:
    # GitHub Actions enforces a 5-minute minimum interval for scheduled
    # workflows — this cannot run more frequently than that.
   - cron: '3,8,13,18,23,28,33,38,43,48,53,58 * * * *'
  workflow_dispatch:

env:
  DISPLAY_NAME: arm-free-vm
  REGION: ap-hyderabad-1
  AVAILABILITY_DOMAIN: AP-HYDERABAD-1-AD-1
  SHAPE: VM.Standard.A1.Flex
  OCPUS: 2
  MEMORY_GB: 12

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install OCI CLI
        run: |
          set -euo pipefail
          curl -L https://raw.githubusercontent.com/oracle/oci-cli/master/scripts/install/install.sh | bash -s -- --accept-all-defaults
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Configure OCI credentials
        run: |
          set -euo pipefail
          mkdir -p ~/.oci
          # printf preserves the exact multi-line PEM content — do NOT use echo here
          printf '%s' "${{ secrets.OCI_PRIVATE_KEY }}" > "$HOME/.oci/oci_api_key.pem"
          chmod 600 "$HOME/.oci/oci_api_key.pem"

          # Use the fully resolved $HOME path — a literal "~" in the config
          # file is not reliably expanded by the OCI SDK's config parser.
          cat > "$HOME/.oci/config" << EOF
          [DEFAULT]
          user=${{ secrets.OCI_USER_ID }}
          fingerprint=${{ secrets.OCI_FINGERPRINT }}
          tenancy=${{ secrets.OCI_TENANCY_ID }}
          region=${REGION}
          key_file=$HOME/.oci/oci_api_key.pem
          EOF
          chmod 600 "$HOME/.oci/config"

          oci setup repair-file-permissions --file "$HOME/.oci/config"
          oci setup repair-file-permissions --file "$HOME/.oci/oci_api_key.pem"

      - name: Check if instance already exists
        id: check
        run: |
          set -euo pipefail
          EXISTING=$(oci compute instance list \
            --compartment-id "${{ secrets.OCI_TENANCY_ID }}" \
            --display-name "${DISPLAY_NAME}" \
            --lifecycle-state RUNNING \
            --query "data[0].id" --raw-output 2>/dev/null || true)

          # also treat PROVISIONING/STARTING as "already in progress"
          if [ -z "$EXISTING" ] || [ "$EXISTING" = "null" ]; then
            EXISTING=$(oci compute instance list \
              --compartment-id "${{ secrets.OCI_TENANCY_ID }}" \
              --display-name "${DISPLAY_NAME}" \
              --query "data[?\"lifecycle-state\"=='PROVISIONING' || \"lifecycle-state\"=='STARTING'].id | [0]" \
              --raw-output 2>/dev/null || true)
          fi

          if [ -n "$EXISTING" ] && [ "$EXISTING" != "null" ]; then
            echo "Instance already exists or is being created: $EXISTING — skipping launch."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "No existing instance found — will attempt launch."
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build launch request
        if: steps.check.outputs.exists == 'false'
        env:
          COMPARTMENT_ID: ${{ secrets.OCI_TENANCY_ID }}
          IMAGE_ID: ${{ secrets.OCI_IMAGE_ID }}
          SUBNET_ID: ${{ secrets.OCI_SUBNET_ID }}
          SSH_PUB_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          # Trim any trailing newline/whitespace from the secret before
          # embedding it — a stray newline is valid JSON but can produce
          # a malformed authorized_keys entry on the instance.
          TRIMMED_KEY=$(printf '%s' "$SSH_PUB_KEY" | tr -d '\r\n')

          # subnetId MUST be explicit inside createVnicDetails — relying on
          # --subnet-id alone (with no subnetId in the JSON body) has been
          # observed to produce a 400 CannotParseRequest from OCI.
          jq -n \
            --arg ad "$AVAILABILITY_DOMAIN" \
            --arg compartment "$COMPARTMENT_ID" \
            --arg shape "$SHAPE" \
            --argjson ocpus "$OCPUS" \
            --argjson mem "$MEMORY_GB" \
            --arg image "$IMAGE_ID" \
            --arg subnet "$SUBNET_ID" \
            --arg name "$DISPLAY_NAME" \
            --arg sshkey "$TRIMMED_KEY" \
            '{
              availabilityDomain: $ad,
              compartmentId: $compartment,
              shape: $shape,
              shapeConfig: { ocpus: $ocpus, memoryInGBs: $mem },
              sourceDetails: { sourceType: "image", imageId: $image },
              displayName: $name,
              createVnicDetails: { subnetId: $subnet, assignPublicIp: true },
              metadata: { ssh_authorized_keys: $sshkey }
            }' > launch_request.json

          echo "--- launch_request.json (validated) ---"
          jq . launch_request.json

      - name: Launch instance
        if: steps.check.outputs.exists == 'false'
        env:
          SUBNET_ID: ${{ secrets.OCI_SUBNET_ID }}
        run: |
          set -euo pipefail

          # Errors matching these patterns mean "no capacity right now" or
          # "rate limited" — expected, routine states while polling for
          # free-tier ARM capacity. CannotParseRequest is included because
          # OCI has been observed returning it for the same reason instead
          # of a clean capacity message, even for a structurally valid
          # request (confirmed via --debug: identical payload got 429 on
          # three consecutive attempts, then CannotParseRequest on the 4th
          # with zero change to the request body).
          RETRYABLE_PATTERN='Out of host capacity|LimitExceeded|TooManyRequests|429|InternalError|CannotParseRequest'

          set +e
          OUTPUT=$(oci compute instance launch \
            --from-json file://launch_request.json \
            --subnet-id "$SUBNET_ID" \
            --debug 2>&1)
          EXIT_CODE=$?
          set -e

          echo "$OUTPUT"

          if [ $EXIT_CODE -eq 0 ]; then
            echo "✅ SUCCESS — instance launched and reached RUNNING."
            exit 0
          fi

          if echo "$OUTPUT" | grep -qE "$RETRYABLE_PATTERN"; then
            echo "⏳ No capacity / rate-limited this round — will retry on next scheduled run."
            exit 0
          fi

          echo "❌ Non-retryable error — failing the job so it's visible."
          exit 1
